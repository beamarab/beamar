<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeamNG Mods Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff5e00; --bg: #050505; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #fff; margin: 0; }
        .page { display: none; padding: 20px; max-width: 1100px; margin: auto; }
        .active { display: block; }
        .main-wrapper { display: flex; gap: 20px; }
        .content { flex: 3; }
        .sidebar { flex: 1; display: none; }
        .hero { height: 200px; display: flex; align-items: center; justify-content: center; background: #000; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { background: #111; padding: 10px; border-radius: 15px; border: 1px solid #333; cursor: pointer; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        .gallery { position: relative; width: 100%; height: 350px; margin-top: 15px; }
        .gallery img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; display: none; }
        .gallery img.active-img { display: block; }
        .nav-btn { position: absolute; top: 50%; background: rgba(0,0,0,0.5); color: white; border: none; padding: 15px; cursor: pointer; }
        .download-btn { display: block; background: var(--accent); padding: 15px; text-align: center; border-radius: 10px; color: white; text-decoration: none; font-weight: bold; margin: 20px auto; cursor: pointer; font-size: 1.2rem; }
        #admin-panel { display: none; background: #111; padding: 20px; border-radius: 20px; margin: 20px auto; border: 2px solid var(--accent); max-width: 500px; }
        #secret-trigger { position: fixed; bottom: 0; left: 0; width: 50px; height: 50px; cursor: pointer; z-index: 9999; }
    </style>
</head>
<body>

    <div id="admin-panel">
        <div style="display:flex; justify-content:space-between;">
            <h2 id="admin-title">إضافة سيارة جديدة (سحابي)</h2>
            <button onclick="document.getElementById('admin-panel').style.display='none'">إغلاق</button>
        </div>
        <input type="text" id="name" placeholder="اسم السيارة" style="width:100%; padding:8px; margin:5px 0;">
        <input type="text" id="img1" placeholder="رابط الصورة 1" style="width:100%; padding:8px; margin:5px 0;">
        <input type="text" id="img2" placeholder="رابط الصورة 2" style="width:100%; padding:8px; margin:5px 0;">
        <input type="text" id="img3" placeholder="رابط الصورة 3" style="width:100%; padding:8px; margin:5px 0;">
        <input type="text" id="link" placeholder="رابط التحميل" style="width:100%; padding:8px; margin:5px 0;">
        <textarea id="desc" placeholder="المواصفات" style="width:100%; height:60px;"></textarea>
        <button id="save-btn" onclick="saveCarToCloud()" style="width:100%; background:var(--accent); padding:10px; border:none; color:white; cursor:pointer;">حفظ في السحابة</button>
    </div>

    <div id="home-page" class="page active">
        <div class="hero"><h1>BEAMNG MODS</h1></div>
        <div class="main-wrapper"><div class="content"><div class="grid" id="cars-grid"></div></div></div>
    </div>

    <div id="details-page" class="page">
        <button onclick="showPage('home-page')">⬅️ رجوع</button>
        <div class="gallery">
            <img id="img-0" class="active-img" src="">
            <img id="img-1" src="">
            <img id="img-2" src="">
            <button class="nav-btn" style="right:0;" onclick="moveImg(1)">▶️</button>
            <button class="nav-btn" style="left:0;" onclick="moveImg(-1)">◀️</button>
        </div>
        <h1 id="d-name"></h1>
        <p id="d-desc" style="color:#ccc;"></p>
        <div onclick="handleDownload()" class="download-btn">تحميل المود مباشر</div>
    </div>

    <div id="secret-trigger" onclick="checkSecret()"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCo1v5Ov-mmn25lpe6P3inS5AMGlcOfA24",
            authDomain: "beamarab-e40e8.firebaseapp.com",
            projectId: "beamarab-e40e8",
            storageBucket: "beamarab-e40e8.firebasestorage.app",
            messagingSenderId: "9178779149",
            appId: "1:9178779149:web:7e37f426294358db1e4f44",
            measurementId: "G-1MLRTRG38X"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // حفظ السيارة في Firebase
        window.saveCarToCloud = async () => {
            const car = {
                name: document.getElementById('name').value,
                imgs: [document.getElementById('img1').value, document.getElementById('img2').value, document.getElementById('img3').value],
                link: document.getElementById('link').value,
                desc: document.getElementById('desc').value
            };
            await addDoc(collection(db, "cars"), car);
            alert("تم الحفظ في السحابة بنجاح!");
            location.reload();
        };

        // جلب السيارات وعرضها
        async function loadCars() {
            const querySnapshot = await getDocs(collection(db, "cars"));
            let cars = [];
            querySnapshot.forEach((doc) => cars.push(doc.data()));
            localStorage.setItem('myCars', JSON.stringify(cars));
            document.getElementById('cars-grid').innerHTML = cars.map((c, i) => `<div class="card" onclick="showDetails(${i})"><img src="${c.imgs[0]}"><h3>${c.name}</h3></div>`).join('');
        }
        loadCars();
    </script>

    <script>
        let currentImg = 0; let clickCount = 0;
        function moveImg(dir) { document.getElementById('img-' + currentImg).classList.remove('active-img'); currentImg = (currentImg + dir + 3) % 3; document.getElementById('img-' + currentImg).classList.add('active-img'); }
        function checkSecret() { clickCount++; if(clickCount >= 10) { if(prompt("كلمة المرور:") === "97477429") { document.getElementById('admin-panel').style.display = 'block'; clickCount = 0; } } }
        function showDetails(i) { let cars = JSON.parse(localStorage.getItem('myCars')); let c = cars[i]; currentImg = 0; document.getElementById('d-name').innerText = c.name; document.getElementById('d-desc').innerText = c.desc; document.getElementById('img-0').src = c.imgs[0]; document.getElementById('img-1').src = c.imgs[1]; document.getElementById('img-2').src = c.imgs[2]; let input = document.createElement('input'); input.id = 'd-link-hidden'; input.type = 'hidden'; input.value = c.link; document.body.appendChild(input); showPage('details-page'); }
        function showPage(pageId) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(pageId).classList.add('active'); }
        function handleDownload() { window.location.href = document.getElementById('d-link-hidden').value; }
    </script>
</body>
</html>
